services:
  backend:
    build:
      context: .
      dockerfile: src/main/docker/Dockerfile.jvm
    image: root/pro-finder:1.0.0-SNAPSHOT
    container_name: pro-finder-backend
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      QUARKUS_PROFILE: prod
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      MAIL_USERNAME: ${MAIL_USERNAME:?Set MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD:?Set MAIL_PASSWORD}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY}
      JWT_PRIVATE_KEY_PATH: /keys/privateKey.pem
      JWT_PUBLIC_KEY_PATH: /keys/publicKey.pem
    volumes:
      - ./keys:/keys:ro
    networks:
      - elk
    depends_on:
      - db
      - redis
      - elasticsearch-logs
      - elasticsearch-search
      - logstash
      - minio

  elasticsearch-logs:
    image: docker.io/elastic/elasticsearch:8.15.0
    container_name: elasticsearch-logs
    ports:
      - "9200:9200"
      - "9300:9300"
    environment:
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
      discovery.type: "single-node"
      xpack.security.enabled: "false"
      xpack.security.http.ssl.enabled: "false"
      cluster.routing.allocation.disk.threshold_enabled: false
    networks:
      - elk

  elasticsearch-search:
    image: docker.io/elastic/elasticsearch:8.15.0
    container_name: elasticsearch-search
    ports:
      - "9201:9200"
    environment:
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
      node.name: "search-node"
      discovery.type: "single-node"
      xpack.security.enabled: "false"
      xpack.security.http.ssl.enabled: "false"
      cluster.routing.allocation.disk.threshold_enabled: false
    networks:
      - elk

  logstash:
    image: docker.io/elastic/logstash:8.15.0
    volumes:
      - ./src/main/resources/logstash.conf:/usr/share/logstash/pipeline/logstash.conf
    ports:
      - "12201:12201/udp"
      - "5000:5000"
      - "9600:9600"
      - "4560:4560"
    networks:
      - elk
    depends_on:
      - elasticsearch-logs

  kibana-logs:
    image: docker.io/elastic/kibana:8.15.0
    container_name: kibana-logs
    environment:
      ELASTICSEARCH_HOSTS: "http://elasticsearch-logs:9200"
      xpack.security.enabled: "false"
    ports:
      - "5601:5601"
    networks:
      - elk
    depends_on:
      - elasticsearch-logs

  kibana-search:
    image: docker.io/elastic/kibana:8.15.0
    container_name: kibana-search
    environment:
      ELASTICSEARCH_HOSTS: "http://elasticsearch-search:9200"
      xpack.security.enabled: "false"
    ports:
      - "5602:5601"
    networks:
      - elk
    depends_on:
      - elasticsearch-search

  db:
    image: postgres:16-alpine
    container_name: profinder-db
    environment:
      POSTGRES_DB: profinder_db
      POSTGRES_USER: iarylser
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - elk

  minio:
    image: quay.io/minio/minio:latest
    container_name: profinder-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - elk

  redis:
    image: redis:3.2
    container_name: profinder-redis
    ports:
      - "6379:6379"
    networks:
      - elk

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - elk

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - backend
    networks:
      - elk

volumes:
  db_data:
  minio_data:

networks:
  elk:
    driver: bridge

