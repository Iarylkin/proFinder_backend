# === COMMON ===
# One database per module (core, auth, messaging) on the same PostgreSQL server. A module touches only its
# own database: no relation, JOIN or foreign key crosses a database. The common entity superclasses are
# mapped in every unit.
quarkus.datasource."core".db-kind=postgresql
quarkus.datasource."core".username=iarylser
quarkus.datasource."core".password=${DB_PASSWORD}
quarkus.datasource."auth".db-kind=postgresql
quarkus.datasource."auth".username=iarylser
quarkus.datasource."auth".password=${DB_PASSWORD}
quarkus.datasource."messaging".db-kind=postgresql
quarkus.datasource."messaging".username=iarylser
quarkus.datasource."messaging".password=${DB_PASSWORD}

quarkus.hibernate-orm."core".datasource=core
quarkus.hibernate-orm."core".packages=io.github.strogolsky.profinder.core.entity,io.github.strogolsky.profinder.common.entity
quarkus.hibernate-orm."auth".datasource=auth
quarkus.hibernate-orm."auth".packages=io.github.strogolsky.profinder.auth.entity,io.github.strogolsky.profinder.common.entity
quarkus.hibernate-orm."messaging".datasource=messaging
quarkus.hibernate-orm."messaging".packages=io.github.strogolsky.profinder.messaging.entity,io.github.strogolsky.profinder.common.entity

%dev.quarkus.hibernate-orm."core".database.generation=drop-and-create
%dev.quarkus.hibernate-orm."auth".database.generation=drop-and-create
%dev.quarkus.hibernate-orm."messaging".database.generation=drop-and-create
%prod.quarkus.hibernate-orm."core".database.generation=none
%prod.quarkus.hibernate-orm."auth".database.generation=none
%prod.quarkus.hibernate-orm."messaging".database.generation=none
%dev.quarkus.hibernate-orm."core".log.sql=true
%dev.quarkus.hibernate-orm."core".log.format-sql=true
%dev.quarkus.hibernate-orm."auth".log.sql=true
%dev.quarkus.hibernate-orm."auth".log.format-sql=true
%dev.quarkus.hibernate-orm."messaging".log.sql=true
%dev.quarkus.hibernate-orm."messaging".log.format-sql=true
%dev.quarkus.hibernate-orm."core".sql-load-script=import-core.sql
%dev.quarkus.hibernate-orm."auth".sql-load-script=import-auth.sql

mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY_PATH:keys/publicKey.pem}
mp.jwt.verify.issuer=quarkus-app
quarkus.jwt.auth.public-key-location=${JWT_PUBLIC_KEY_PATH:keys/publicKey.pem}
smallrye.jwt.sign.key.location=${JWT_PRIVATE_KEY_PATH:keys/privateKey.pem}
smallrye.jwt.sign.algorithm=RS256

quarkus.rest.path=/api

quarkus.mailer.from=noreply@profinder.app
quarkus.mailer.host=sandbox.smtp.mailtrap.io
quarkus.mailer.port=2525
quarkus.mailer.ssl=false
quarkus.mailer.start-tls=REQUIRED
quarkus.mailer.username=${MAIL_USERNAME}
quarkus.mailer.password=${MAIL_PASSWORD}

quarkus.minio.access-key=${MINIO_ACCESS_KEY}
quarkus.minio.secret-key=${MINIO_SECRET_KEY}
quarkus.minio.secure=false

quarkus.http.host=0.0.0.0

# === METRICS ===
quarkus.micrometer.export-prometheus.enabled=true
quarkus.micrometer.binder.jvm.enabled=true
quarkus.micrometer.binder.http-server.enabled=true
quarkus.micrometer.binder.system.enabled=true

# === LOGGING ===
quarkus.log.console.enable=true
quarkus.log.console.json.enabled=false
quarkus.log.socket.json.enabled=true
quarkus.log.socket.json.exception-output-type=formatted
quarkus.log.socket.json.log-format=ECS

# === DEV profile ===
%dev.quarkus.datasource."core".jdbc.url=jdbc:postgresql://localhost:5432/core_db
%dev.quarkus.datasource."auth".jdbc.url=jdbc:postgresql://localhost:5432/auth_db
%dev.quarkus.datasource."messaging".jdbc.url=jdbc:postgresql://localhost:5432/messaging_db
%dev.quarkus.elasticsearch.hosts=localhost:9201
%dev.quarkus.redis.hosts=redis://localhost:6379
%dev.quarkus.log.socket.endpoint=localhost:4560
%dev.quarkus.minio.host=localhost
%dev.quarkus.minio.port=9000

# === PROD profile ===
%prod.quarkus.datasource."core".jdbc.url=jdbc:postgresql://db-core:5432/core_db
%prod.quarkus.datasource."auth".jdbc.url=jdbc:postgresql://db-auth:5432/auth_db
%prod.quarkus.datasource."messaging".jdbc.url=jdbc:postgresql://db-messaging:5432/messaging_db
%prod.quarkus.elasticsearch.hosts=elasticsearch-search:9200
%prod.quarkus.redis.hosts=redis://redis:6379
%prod.quarkus.log.socket.endpoint=logstash:4560
%prod.quarkus.minio.host=host.docker.internal
%prod.quarkus.minio.port=9000

# JSON: unknown fields are ignored (docs/13), dates are ISO 8601 strings, nulls are written
quarkus.jackson.fail-on-unknown-properties=false
quarkus.jackson.write-dates-as-timestamps=false

# === TEST profile ===
# The tests of the repositories run against real PostgreSQL databases that Quarkus starts in containers (Dev
# Services): one per module, no URL is set on purpose. Elasticsearch, Redis and MinIO are not started, nothing
# in these tests talks to them. The passwords and keys are only values that make the configuration complete.
%test.quarkus.datasource."core".password=test
%test.quarkus.datasource."auth".password=test
%test.quarkus.datasource."messaging".password=test
%test.quarkus.hibernate-orm."core".database.generation=drop-and-create
%test.quarkus.hibernate-orm."auth".database.generation=drop-and-create
%test.quarkus.hibernate-orm."messaging".database.generation=drop-and-create
%test.quarkus.hibernate-orm."core".sql-load-script=import-test-core.sql
%test.quarkus.elasticsearch.devservices.enabled=false
%test.quarkus.elasticsearch.hosts=localhost:9
%test.quarkus.redis.devservices.enabled=false
%test.quarkus.redis.hosts=redis://localhost:6379
%test.quarkus.minio.host=localhost
%test.quarkus.minio.port=9000
%test.quarkus.minio.access-key=test
%test.quarkus.minio.secret-key=test-secret-key
%test.quarkus.mailer.username=test
%test.quarkus.mailer.password=test
%test.quarkus.mailpit.devservices.enabled=false
%test.quarkus.jacoco.reuse-data-file=true
%test.quarkus.jacoco.data-file=target/jacoco.exec
%test.quarkus.jacoco.report=false
